.post.h-entry::before {

}

    0% { opacity: 0.6; }
    100% { opacity: 1; }
}

.celebration-fx {
    position: fixed;

.celebration-star {
    position: absolute;
    color: #ffd700;

    animation: star-pop 2.4s ease-in-out infinite;
    font-size: 1.2rem;
    opacity: 0;
}

.celebration-sparkle {
    position: absolute;

    opacity: 0;
}

.celebration-balloons .balloon {
    position: absolute;

    height: auto;
    opacity: 0;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
    animation: balloon-rise 14s ease-in-out infinite;
}

@keyframes star-pop {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    20% { transform: scale(1.4) rotate(120deg); opacity: 1; }
    50% { transform: scale(1) rotate(240deg); opacity: 0.9; }

}

@keyframes sparkle-pop {

    75% { transform: scale(1.3); opacity: 1; }

}

@keyframes balloon-rise {

    100% { transform: translateY(-15vh) translateX(-10px) rotate(-4deg) scale(0.85); opacity: 0; }
